server:
  port: 8085

spring:
  application:
    name: settlement-service

  datasource:
    url: jdbc:mysql://localhost:3306/settlement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: settlement-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.payment.gateway.*"

aws:
  s3:
    endpoint: http://localhost:4566
    bucket-name: payment-gateway-settlements
    region: us-east-1
    access-key: test
    secret-key: test

logging:
  level:
    com.payment.gateway: DEBUG
    org.flywaydb: INFO